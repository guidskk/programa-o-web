<!DOCTYPE html>

<meta charset="UTF-8">
<title>Exercício 04</title>

<body>

<h1>Triângulo de Asteriscos</h1>
<p>Abra o console do navegador para ver o resultado.</p>

<script>

let linhas = parseInt(prompt("Digite o número de linhas do triângulo:"));

for(let i = 1; i <= linhas; i++){
    let estrelas = "";

    for(let j = 1; j <= i; j++){
        estrelas += "*";
    }

    console.log(estrelas);
}

</script>

</body>
</html>
